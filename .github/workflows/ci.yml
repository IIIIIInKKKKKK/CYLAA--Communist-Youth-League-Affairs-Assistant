name: Edge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          m = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))
          assert re.fullmatch(r"\d+\.\d+\.\d+", m["version"]), m["version"]
          assert m["permissions"] == ["storage"], m["permissions"]
          assert m["host_permissions"] == ["https://zhtj.youth.cn/*"], m["host_permissions"]
          assert m["content_scripts"][0]["js"] == ["content.js"], m["content_scripts"]
          print("manifest OK")
          PY

      - name: Syntax check
        run: node --check content.js

      - name: Check forbidden tokens
        run: |
          if grep -rniE 'github|jsdelivr|gitee|version\.json|update\.js' content.js manifest.json; then
            echo "forbidden token found"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          zip -r dist/CYLAA-edge-1.0.0.zip manifest.json content.js icons

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cylaa-edge
          path: dist/CYLAA-edge-1.0.0.zip
          if-no-files-found: error
