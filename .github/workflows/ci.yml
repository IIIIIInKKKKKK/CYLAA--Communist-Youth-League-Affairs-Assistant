name: GitHub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          import pathlib

          m = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))
          assert m["manifest_version"] == 3
          assert m["content_scripts"][0]["js"] == ["content.js", "update.js"], m["content_scripts"]
          assert m["host_permissions"] == ["https://zhtj.youth.cn/*"], m["host_permissions"]
          print("manifest OK", m["version"])
          PY

      - name: Syntax check
        run: |
          node --check content.js
          node --check update.js

      - name: Package
        run: |
          VERSION=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          mkdir -p dist
          zip -r "dist/CYLAA-github-${VERSION}.zip" manifest.json content.js update.js icons

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cylaa-github
          path: dist/CYLAA-github-*.zip
          if-no-files-found: error
