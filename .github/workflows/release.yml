name: GitHub Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package
        run: |
          VERSION=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          mkdir -p dist
          zip -r "dist/CYLAA-github-${VERSION}.zip" manifest.json content.js update.js icons

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/CYLAA-github-*.zip \
            --title "团务助手 ${GITHUB_REF_NAME}" \
            --generate-notes
